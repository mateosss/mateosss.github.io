<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groups Acting on Objects</title>
  <link rel="stylesheet" href="common.css" />
  <script src="common.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <section class="view" id="view">
      <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
      <div class="timeline">
        <button class="btn primary" id="play">❚❚ Pause</button>
        <input type="range" id="time" />
        <span class="tval" id="tval"></span>
        <select id="speed" title="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5" selected>0.5×</option>
          <option value="1">1×</option>
        </select>
      </div>
    </section>

    <aside class="side">
      <h1>Groups acting on objects</h1>

      <h2>Group</h2>
      <div class="seg" id="group">
        <button data-v="T3">(ℝ³, +)</button>
        <button data-v="SO3">SO(3)</button>
        <button data-v="SE3" class="active">SE(3)</button>
      </div>

      <h2>Operation</h2>
      <div class="seg" id="op">
        <button data-v="act" class="active">g · x</button>
        <button data-v="compose">g ∘ h</button>
        <button data-v="inverse">g⁻¹ ∘ g</button>
        <button data-v="commute">g∘h vs h∘g</button>
      </div>
      <p class="explain" id="explain"></p>

      <h2>Current pose of the object</h2>
      <pre class="mat" id="mat"></pre>
      <div class="row" id="checks"></div>

      <details>
        <summary>Elements <span class="badge" style="background: var(--c-g)">g</span> and <span class="badge" style="background: var(--c-h)">h</span></summary>
        <div class="row" style="margin-top: 6px">
          <button class="btn" id="random">Randomize</button>
          <button class="btn" id="reset">Reset</button>
        </div>
        <div id="sliders"></div>
      </details>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const C = { g: 0xe8710a, h: 0x2196f3, gh: 0x9c27b0, hg: 0x4caf50, obj: 0x8d8d8d, e: 0x555555 };
    const css = (c) => '#' + c.toString(16).padStart(6, '0');

    const view = document.getElementById('view');
    const { scene, render } = Viz.setup(THREE, OrbitControls, CSS2DRenderer, view, { eye: [4.5, -6.5, 4], target: [0.8, 0.3, 0.5] });

    // Tangent vectors (v, w) of the two elements g = exp(xi_g), h = exp(xi_h)
    const DEFAULT = { g: [1.6, 0.6, 1.2, 0.0, 0.2, 1.4], h: [1.2, -1.4, 0.0, 1.3, 0.0, 0.0] };
    const xi = { g: [...DEFAULT.g], h: [...DEFAULT.h] };
    let group = 'SE3';
    let op = 'act';

    // Restrict the tangent vector to the chosen group
    const mask = (x) => group === 'T3' ? [x[0], x[1], x[2], 0, 0, 0] : group === 'SO3' ? [0, 0, 0, x[3], x[4], x[5]] : x;
    const path = (x, s) => Lie.expSE3(Lie.scale(mask(x), s)); // one-parameter subgroup exp(s xi)
    const el = (k) => path(xi[k], 1);

    // --- Scene objects -------------------------------------------------------
    const identityFrame = Viz.triad(THREE, 0.9);
    identityFrame.add(Viz.label(THREE, CSS2DObject, 'e', css(C.e), [-0.15, -0.15, -0.15]));
    scene.add(identityFrame);

    function ghostFrame(name, color) {
      const g = new THREE.Group();
      g.add(Viz.cameraModel(THREE, color, 0.22));
      g.add(Viz.label(THREE, CSS2DObject, name, css(color), [0, 0, -0.5]));
      scene.add(g);
      return g;
    }
    const ghosts = { g: ghostFrame('g', C.g), h: ghostFrame('h', C.h), gh: ghostFrame('g∘h', C.gh), hg: ghostFrame('h∘g', C.hg) };

    const objA = Viz.cameraModel(THREE, C.obj);
    const objB = Viz.cameraModel(THREE, C.hg, 0.8);
    scene.add(objA, objB);

    // A material point p attached to the object; we draw the curve it follows
    const P_LOCAL = [0.45, -0.32, 0.75];
    // Rotations act about the origin, so in SO(3) the object starts away from it at x0 to not overlap everything
    const place = (P) => group === 'SO3' ? Lie.compose(P, { R: Lie.I(), t: [1.8, 0, 0] }) : P;
    const trailA = Viz.polyline(THREE, 0x444444, 400, { opacity: 0.35 });
    const trailB = Viz.polyline(THREE, C.hg, 400, { opacity: 0.45 });
    const doneA = Viz.polyline(THREE, 0x222222, 400);
    const doneB = Viz.polyline(THREE, C.hg, 400);
    const dotA = Viz.dot(THREE, 0x222222, 0.06), dotB = Viz.dot(THREE, C.hg, 0.06);
    scene.add(trailA, trailB, doneA, doneB, dotA, dotB);
    const labelA = Viz.label(THREE, CSS2DObject, 'p', '#222', [0, 0, 0.18]);
    dotA.add(labelA);

    // --- Animations: pose of the object(s) as a function of the time tau ----
    // Each operation is a smooth path through the group starting at the identity.
    const OPS = {
      act: {
        dur: 1,
        text: () => (group === 'SO3' ? 'The object starts at x₀ (not at the origin) so that the rotations are easier to see. ' : '') + 'An element <b style="color:#e8710a">g</b> is a point of the group (the ghost frame), but it also <i>acts</i> on objects: '
          + 'the object at <b>e</b> moves smoothly to <b>g</b> along exp(τ·log g), τ∈[0,1]. The point p follows the curve g(τ)·p.',
        ghosts: ['g'],
        poseA: (t) => path(xi.g, t),
      },
      compose: {
        dur: 2,
        text: () => 'Closure: first apply <b style="color:#2196f3">h</b> (τ∈[0,1]), then <b style="color:#e8710a">g</b> (τ∈[1,2]). '
          + 'The result is again one element <b style="color:#9c27b0">g∘h</b>. Note that g acts on the element h itself: '
          + 'g∘h is "h rotated/moved by g" (left multiplication = applied in the world frame).',
        ghosts: ['g', 'h', 'gh'],
        poseA: (t) => t < 1 ? path(xi.h, t) : Lie.compose(path(xi.g, t - 1), el('h')),
      },
      inverse: {
        dur: 2,
        text: () => 'Inverse: apply <b style="color:#e8710a">g</b> and then g⁻¹ = exp(−log g), which smoothly undoes it, so g⁻¹∘g = e. '
          + (group === 'SE3' ? 'For SE(3): g⁻¹ = (Rᵀ, −Rᵀt).' : group === 'SO3' ? 'For SO(3): R⁻¹ = Rᵀ.' : 'For (ℝ³,+): the inverse of v is −v.'),
        ghosts: ['g'],
        poseA: (t) => t < 1 ? path(xi.g, t) : Lie.compose(path(xi.g, -(t - 1)), el('g')),
      },
      commute: {
        dur: 2,
        text: () => 'Grey: h then g (= <b style="color:#9c27b0">g∘h</b>). Green: g then h (= <b style="color:#4caf50">h∘g</b>). '
          + (group === 'T3' ? 'Translations commute: both end in the same place (abelian group).'
            : 'Rotations and rigid motions do <b>not</b> commute: the order matters!'),
        ghosts: ['gh', 'hg'],
        poseA: (t) => t < 1 ? path(xi.h, t) : Lie.compose(path(xi.g, t - 1), el('h')),
        poseB: (t) => t < 1 ? path(xi.g, t) : Lie.compose(path(xi.h, t - 1), el('g')),
      },
    };

    function sample(fn, dur, n = 240) {
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(Lie.act(place(fn((dur * i) / n)), P_LOCAL));
      return pts;
    }

    let fullA = [], fullB = [];
    function rebuild() {
      const o = OPS[op];
      Viz.setPose(THREE, ghosts.g, place(el('g')));
      Viz.setPose(THREE, ghosts.h, place(el('h')));
      Viz.setPose(THREE, ghosts.gh, place(Lie.compose(el('g'), el('h'))));
      Viz.setPose(THREE, ghosts.hg, place(Lie.compose(el('h'), el('g'))));
      for (const k in ghosts) ghosts[k].traverse((x) => (x.visible = o.ghosts.includes(k))); // also hides the labels
      fullA = sample(o.poseA, o.dur);
      trailA.setPoints(fullA);
      const hasB = !!o.poseB;
      [objB, trailB, doneB, dotB].forEach((x) => x.traverse((y) => (y.visible = hasB)));
      if (hasB) { fullB = sample(o.poseB, o.dur); trailB.setPoints(fullB); }
      document.getElementById('explain').innerHTML = o.text();
      player.duration = o.dur;
      update(player.t);
    }

    function update(t) {
      const o = OPS[op];
      t = Math.min(t, o.dur);
      const A = o.poseA(t);
      Viz.setPose(THREE, objA, place(A));
      const pA = Lie.act(place(A), P_LOCAL);
      dotA.position.set(...pA);
      const k = Math.round((t / o.dur) * (fullA.length - 1));
      doneA.setPoints(fullA.slice(0, k + 1));
      if (o.poseB) {
        const B = o.poseB(t);
        Viz.setPose(THREE, objB, place(B));
        dotB.position.set(...Lie.act(place(B), P_LOCAL));
        doneB.setPoints(fullB.slice(0, k + 1));
      }
      showMatrix(A);
    }

    function showMatrix(A) {
      const m = document.getElementById('mat');
      const checks = document.getElementById('checks');
      if (group === 'T3') {
        m.textContent = 't = ' + Fmt.vec(A.t);
        checks.innerHTML = '';
        return;
      }
      m.textContent = group === 'SO3' ? Fmt.mat(A.R) : Fmt.pose(A);
      const RtR = Lie.mul(Lie.T(A.R), A.R);
      const err = Math.max(...Lie.msub(RtR, Lie.I()).flat().map(Math.abs));
      checks.innerHTML = `det R = ${Lie.det(A.R).toFixed(3)} &nbsp;·&nbsp; ‖RᵀR − I‖ = ${err.toExponential(0)}`;
    }

    // --- UI -------------------------------------------------------------------
    const player = makePlayer({
      playBtn: document.getElementById('play'),
      slider: document.getElementById('time'),
      readout: document.getElementById('tval'),
      duration: 1,
      speed: 0.5,
      fmt: (t) => 'τ = ' + Math.min(t, OPS[op].dur).toFixed(2),
      onChange: (t) => update(t),
    });
    document.getElementById('speed').addEventListener('change', (e) => (player.speed = parseFloat(e.target.value)));

    function segmented(id, onPick) {
      const root = document.getElementById(id);
      root.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        root.querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
        onPick(b.dataset.v);
      });
    }
    segmented('group', (v) => { group = v; buildSliders(); player.seek(0); player.play(); rebuild(); });
    segmented('op', (v) => { op = v; player.seek(0); player.play(); rebuild(); });

    const NAMES = ['v₁', 'v₂', 'v₃', 'ω₁', 'ω₂', 'ω₃'];
    function buildSliders() {
      const root = document.getElementById('sliders');
      root.innerHTML = '';
      for (const k of ['g', 'h']) {
        const idx = group === 'T3' ? [0, 1, 2] : group === 'SO3' ? [3, 4, 5] : [0, 1, 2, 3, 4, 5];
        const head = document.createElement('div');
        head.innerHTML = `<b style="color:${k === 'g' ? 'var(--c-g)' : 'var(--c-h)'}">log ${k}</b>`;
        root.appendChild(head);
        for (const i of idx) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<label>${NAMES[i]}</label><input type="range" min="-2" max="2" step="0.01" value="${xi[k][i]}"><span style="width:3em">${xi[k][i].toFixed(2)}</span>`;
          const [input, out] = [row.querySelector('input'), row.querySelector('span')];
          input.addEventListener('input', () => { xi[k][i] = parseFloat(input.value); out.textContent = xi[k][i].toFixed(2); rebuild(); });
          root.appendChild(row);
        }
      }
    }
    document.getElementById('random').addEventListener('click', () => {
      for (const k of ['g', 'h']) xi[k] = xi[k].map((_, i) => (Math.random() * 2 - 1) * (i < 3 ? 1.8 : 1.5));
      buildSliders(); rebuild();
    });
    document.getElementById('reset').addEventListener('click', () => {
      xi.g = [...DEFAULT.g]; xi.h = [...DEFAULT.h];
      buildSliders(); rebuild();
    });

    buildSliders();
    rebuild();
    renderer_loop();
    function renderer_loop(now = 0) {
      player.tick(now);
      render();
      requestAnimationFrame(renderer_loop);
    }
  </script>
</body>
</html>
